[package]
name = "rapi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
icu_collator = "2.4.0"
indexmap = { version = "2.14.2", features = ["serde"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
full_moon = { version = "3.0.0", default-features = false, features = ["luau"] }
png = "0.18.1"
rayon = "1.12.0"
regex = "1.13.1"
rapi-routes.workspace = true
rapi-search.workspace = true
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
stylua = { version = "2.6.0", default-features = false, features = ["luau"] }
url = "2.5.8"
