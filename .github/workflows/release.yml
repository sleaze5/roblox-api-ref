name: Check for a new Roblox version

on:
    schedule:
        - cron: 0 * * * *
    workflow_dispatch:
        inputs:
            force:
                description: Run CI even if Roblox has not released a new version
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    update:
        if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 15
        permissions:
            contents: write
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup

            - id: version
              run: |
                  bun vp run dump:update
                  if git diff --quiet -- roblox-versions.json; then changed=false; else changed=true; fi
                  echo "changed=$changed" >> "$GITHUB_OUTPUT"

            - if: steps.version.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add roblox-versions.json diffs
                  git commit -m "Update Roblox to LIVE $(jq -r '.[-1].version' roblox-versions.json)"

            - if: steps.version.outputs.changed == 'true'
              uses: ./.github/actions/land
              with:
                  branch: release/update

            - if: inputs.force
              run: gh workflow run ci.yml --ref "$BRANCH"
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ github.event.repository.default_branch }}
