name: Dependabot

on: pull_request

permissions: {}

jobs:
    auto-merge:
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-slim
        timeout-minutes: 5
        permissions:
            contents: write
            pull-requests: write
        steps:
            - run: gh pr merge --auto --squash "$PR_URL"
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
