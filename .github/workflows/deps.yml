name: Update dependencies

on:
    schedule:
        - cron: 17 6 * * 1
    workflow_dispatch:
        inputs:
            scope:
                description: Update every dependency, or only the ones that Dependabot skips
                type: choice
                options:
                    - all
                    - uncovered
                default: all

permissions:
    contents: read

concurrency:
    group: deps
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 20
        permissions:
            contents: write
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup

            - id: bun
              run: |
                  bun scripts/deps/update.ts "--$SCOPE"
                  echo "version=$(jq -r .devEngines.packageManager.version package.json)" >> "$GITHUB_OUTPUT"
              env:
                  SCOPE: ${{ inputs.scope || 'uncovered' }}
                  DEPS_SUMMARY_FILE: ${{ runner.temp }}/deps.md

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ steps.bun.outputs.version }}

            - id: update
              run: |
                  bun install
                  if git diff --quiet -- package.json bun.lock; then changed=false; else changed=true; fi
                  echo "changed=$changed" >> "$GITHUB_OUTPUT"

            - if: steps.update.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Update dependencies" -m "$(cat "$RUNNER_TEMP/deps.md")" -- package.json bun.lock

            - if: steps.update.outputs.changed == 'true'
              uses: ./.github/actions/land
              with:
                  branch: deps/update
