name: CI

on:
    push:
        branches-ignore:
            - main
    pull_request:
    workflow_dispatch:
        inputs:
            scope:
                description: Check everything, or only the parts that the commits since the default branch change
                type: choice
                options:
                    - all
                    - changed
                default: all

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
    changes:
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 5
        outputs:
            rust: ${{ steps.changes.outputs.rust }}
            data: ${{ steps.changes.outputs.data }}
            web: ${{ steps.changes.outputs.web }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  filter: blob:none
            - id: changes
              uses: ./.github/actions/changes
              with:
                  base: ${{ github.base_ref || github.event.repository.default_branch }}
                  all: ${{ inputs.scope == 'all' }}

    format:
        needs: generate
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-bun
            - uses: ./.github/actions/setup-rust
            - uses: ./.github/actions/generated
              with:
                  key: ${{ needs.generate.outputs.key }}
            - run: bun vp run format:check

    clippy:
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-bun
            - uses: ./.github/actions/setup-rust
              with:
                  cache: check
            - run: bun vp run clippy

    rust-test:
        needs: changes
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.data == 'true'
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-bun
            - uses: ./.github/actions/setup-rust
              with:
                  cache: release
            - uses: ./.github/actions/api-data
            - run: bun vp run rust:test

    generate:
        needs: changes
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 20
        outputs:
            key: ${{ steps.generate.outputs.key }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - id: generate
              uses: ./.github/actions/generate

    web-check:
        needs: [changes, generate]
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-bun
            - uses: ./.github/actions/generated
              with:
                  key: ${{ needs.generate.outputs.key }}
            - run: bun vp run --ignore-depends-on web:check

    web-test:
        needs: [changes, generate]
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.data == 'true' || needs.changes.outputs.web == 'true'
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-bun
            - uses: ./.github/actions/generated
              with:
                  key: ${{ needs.generate.outputs.key }}
            - run: bun vp run --ignore-depends-on web:test

    site:
        needs: [changes, generate]
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.data == 'true' || needs.changes.outputs.web == 'true'
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-bun
            - uses: ./.github/actions/generated
              with:
                  key: ${{ needs.generate.outputs.key }}
            - run: bun vp run --ignore-depends-on dist
            - uses: ./.github/actions/playwright
            - run: bun vp run test:browser

    build:
        needs: [changes, format, clippy, rust-test, generate, web-check, web-test, site]
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork)
        runs-on: ubuntu-slim
        timeout-minutes: 5
        steps:
            - run: |
                  echo "$RESULTS"
                  [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]
              env:
                  RESULTS: ${{ toJSON(needs) }}
