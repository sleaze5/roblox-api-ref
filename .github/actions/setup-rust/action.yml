name: Setup Rust
description: Install the toolchain in rust-toolchain.toml and restore the compiled dependencies for one kind of build. Only the default branch saves them, so every branch starts from the same cache.

inputs:
    cache:
        description: The kind of build to cache dependencies for, such as `check` or `release`. Empty skips the cache.
        default: ""
    save:
        description: Whether to save the cache after the job. The cache workflow on the default branch saves it.
        default: "false"

outputs:
    cache-hit:
        description: Whether the cache matched Cargo.lock and the toolchain exactly
        value: ${{ steps.cache.outputs.cache-hit }}

runs:
    using: composite
    steps:
        - shell: bash
          run: |
              if ! command -v rustup > /dev/null; then
                  curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  export PATH="$HOME/.cargo/bin:$PATH"
              fi
              rustup toolchain install

        - id: cache
          if: inputs.cache != ''
          uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
          with:
              shared-key: ${{ inputs.cache }}
              save-if: ${{ inputs.save == 'true' }}
