name: Build
description: Check, test, and build the site. With pages, upload it to GitHub Pages.

inputs:
    pages:
        description: Upload the site as a GitHub Pages artifact.
        default: "false"

runs:
    using: composite
    steps:
        - run: vp run ci
          shell: bash

        - if: inputs.pages == 'true'
          run: find dist -type f \( -name '*.br' -o -name '*.gz' -o -name '*.zst' \) -delete
          shell: bash

        - if: inputs.pages == 'true'
          uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
          with:
              path: dist
