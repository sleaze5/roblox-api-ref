name: Setup
description: Install Vite+, Bun, and dependencies, and restore the downloaded Roblox API files.

runs:
    using: composite
    steps:
        - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
          with:
              cache: true

        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: data
              key: roblox-api-${{ hashFiles('roblox-versions.json') }}
