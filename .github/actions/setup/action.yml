name: Setup
description: Install Bun, Rust, and dependencies, and restore the downloaded Roblox API files and the Cargo build cache.

runs:
    using: composite
    steps:
        - id: bun
          shell: bash
          run: echo "version=$(jq -r .devEngines.packageManager.version package.json)" >> "$GITHUB_OUTPUT"

        - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
          with:
              bun-version: ${{ steps.bun.outputs.version }}

        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

        - shell: bash
          run: bun install --frozen-lockfile

        - shell: bash
          run: |
              if ! command -v rustup > /dev/null; then
                  curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  export PATH="$HOME/.cargo/bin:$PATH"
              fi
              rustup toolchain install

        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: |
                  ~/.cargo/registry/index
                  ~/.cargo/registry/cache
                  ~/.cargo/git/db
                  target
              key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ hashFiles('crates/**/*.rs') }}
              restore-keys: |
                  cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
                  cargo-${{ runner.os }}-${{ runner.arch }}-

        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: data
              key: roblox-api-${{ hashFiles('roblox-versions.json') }}
