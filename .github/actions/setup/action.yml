name: Setup
description: Install Vite+, Bun, and dependencies, and restore the downloaded Roblox API files.

runs:
    using: composite
    steps:
        - uses: voidzero-dev/setup-vp@v1.21.2
          with:
              cache: true

        - uses: actions/cache@v6.1.0
          with:
              path: data
              key: roblox-api-${{ hashFiles('roblox-version.json') }}
