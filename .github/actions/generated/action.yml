name: Generated
description: Restore src/generated, data/, and the rapi binary that the `generate` action cached, and point RAPI_BIN at the binary, so the job needs no Rust toolchain. Run tasks with `--ignore-depends-on` so that `gen` does not run again.

inputs:
    key:
        description: The `key` output of the `generate` action
        required: true

runs:
    using: composite
    steps:
        - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: |
                  src/generated
                  data
                  target/release/rapi
              key: ${{ inputs.key }}
              fail-on-cache-miss: true

        - shell: bash
          run: echo "RAPI_BIN=$GITHUB_WORKSPACE/target/release/rapi" >> "$GITHUB_ENV"
