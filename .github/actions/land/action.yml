name: Land
description: Push the current commit to a branch, run CI on what it changes, move the default branch to it once CI passes, and warm the default branch caches for it.

inputs:
    branch:
        description: The branch that CI runs on before the commit lands
        required: true

runs:
    using: composite
    steps:
        - shell: bash
          run: |
              sha=$(git rev-parse HEAD)
              git push --force origin "HEAD:refs/heads/$BRANCH"
              gh workflow run ci.yml --ref "$BRANCH" -f scope=changed
              for attempt in $(seq 30); do
                  run=$(gh run list --workflow ci.yml --event workflow_dispatch --commit "$sha" --json databaseId --jq '.[0].databaseId')
                  [ -n "$run" ] && break
                  sleep 5
              done
              gh run watch "$run" --exit-status --compact --interval 15
              git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
              gh workflow run cache.yml --ref "$DEFAULT_BRANCH"
          env:
              BRANCH: ${{ inputs.branch }}
              DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              GH_TOKEN: ${{ github.token }}
