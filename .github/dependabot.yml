version: 2
updates:
    - package-ecosystem: github-actions
      directories:
          - /
          - /.github/actions/*
      schedule:
          interval: weekly
      ignore:
          - dependency-name: "*"
            update-types:
                - version-update:semver-major
      groups:
          actions:
              patterns:
                  - "*"

    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      ignore:
          - dependency-name: "*"
            update-types:
                - version-update:semver-major
          - dependency-name: vite
          - dependency-name: vite-plus
      groups:
          packages:
              patterns:
                  - "*"

    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      ignore:
          - dependency-name: "*"
            update-types:
                - version-update:semver-major
      groups:
          crates:
              patterns:
                  - "*"
